# Request limits (per client IP) -- part of the network-level controls, see docs/DOCKER-SECURITY.md
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server_tokens off;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  limit_conn perip 20;
  client_max_body_size 1k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;

  include /etc/nginx/snippets/security-headers.conf;

  # Public API surface: ONE read-only endpoint. Writes (PUT /api/content/:key) and
  # everything else under /api/ are deliberately not proxied, so the admin interface
  # is not reachable from outside the container network.
  location = /api/content {
    limit_except GET { deny all; }
    limit_req zone=api burst=20 nodelay;

    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_hide_header X-Powered-By;

    include /etc/nginx/snippets/security-headers.conf;
  }

  location /api/ {
    return 404;
  }

  # Fingerprinted build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Never serve dotfiles, except /.well-known (security.txt).
  location ~ /\.(?!well-known) {
    return 404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
